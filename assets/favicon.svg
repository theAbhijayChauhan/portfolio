<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mobiusMintCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffc8" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <linearGradient id="mobiusGoldAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffc8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian Dark Squircle Frame -->
  <rect width="512" height="512" rx="136" fill="#060913"/>
  <rect x="20" y="20" width="472" height="472" rx="120" fill="none" stroke="url(#rimGrad)" stroke-width="12" opacity="0.85"/>

  <!-- Background Ambient Glow Aura -->
  <circle cx="170" cy="256" r="100" fill="#00ffc8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="342" cy="256" r="100" fill="#fbbf24" opacity="0.08" filter="url(#glow)"/>

  <!-- 3D DevOps Mobius Infinity Ribbon Loop -->
  <!-- Back Under-Pass Loop (Right side operating arc) -->
  <path d="M 256 256 C 290 295 335 325 385 325 C 440 325 470 285 470 256 C 470 227 440 187 385 187 C 335 187 290 217 256 256 Z"
        fill="none"
        stroke="url(#mobiusGoldAmber)"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9"
        filter="url(#glow)"/>

  <!-- Front Over-Pass Loop (Left side dev/code arc) -->
  <path d="M 256 256 C 222 217 177 187 127 187 C 72 187 42 227 42 256 C 42 285 72 325 127 325 C 177 325 222 295 256 256 Z"
        fill="none"
        stroke="url(#mobiusMintCyan)"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Central 3D Intersection Crossover -->
  <circle cx="256" cy="256" r="18" fill="#060913"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="6" fill="#00ffc8"/>

  <!-- Orbital High-Voltage Energy Nodes on Ribbon -->
  <circle cx="127" cy="187" r="8" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="385" cy="325" r="8" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="42" cy="256" r="7" fill="#00ffc8"/>
  <circle cx="470" cy="256" r="7" fill="#fbbf24"/>
</svg>
